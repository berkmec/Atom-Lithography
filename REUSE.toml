version = 1
SPDX-PackageName = "Atom Lithography Machine"
SPDX-PackageSupplier = "berkmec (https://counfield.com/)"
SPDX-PackageDownloadLocation = "https://github.com/berkmec/Atom-Lithography"

# Rule 1a — Pure software, control stack, tests, HTML5 twin & repo metadata
[[annotations]]
path = [
    "src/machine_control/**/*.py",
    "tests/**/*.py",
    "docs/digital_twin_interactive.html",
    "requirements.txt",
    ".gitignore",
    "NOTICE",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 berkmec (https://counfield.com/)"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Rule 1b — Physics experiment scripts (closest so Rule 2 overrides build_bom_detailed.py cleanly)
[[annotations]]
path = [
    "experiments/**/*.py",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 berkmec (https://counfield.com/)"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Rule 2 — Dual-copyleft bridge (hardware/CAD/PCB/BOM generators, RTL Makefiles, SW ICDs,
# master registry, BOM CSVs, CAD summary JSON & experimental/spec JSON/JSONL archives).
# Both options are strongly reciprocal copyleft, eliminating cross-license deadlocks while
# closing both cloud/SaaS and physical-hardware/silicon appropriation loopholes.
[[annotations]]
path = [
    "hardware/**/*.py",
    "research/**/*.py",
    "src/board/detector_frontend.py",
    "experiments/exp128_bom_sensitivity/build_bom_detailed.py",
    "rtl/**/Makefile",
    "hardware/parts_registry.json",
    "hardware/icd/parts/S8.*.json",
    "research/atom_lithography_machine/BOM.csv",
    "research/atom_lithography_machine/BOM_DETAILED.csv",
    "research/atom_lithography_machine/cad/cad_verification.json",
    "results/**/*.json",
    "results/**/*.jsonl",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 berkmec (https://counfield.com/)"
SPDX-License-Identifier = "AGPL-3.0-or-later OR CERN-OHL-S-2.0"

# Rule 3 — Physical hardware designs, silicon/FPGA Verilog RTL, PCBs, CAD, SPICE & hardware ICDs
[[annotations]]
path = [
    "**/*.v",
    "**/*.sv",
    "**/*.xdc",
    "**/*.hex",
    "**/*.mem",
    "**/*.ys",
    "**/*.stl",
    "**/*.step",
    "**/*.scad",
    "**/*.dxf",
    "**/*.svg",
    "**/*.kicad_pcb",
    "**/*.kicad_sch",
    "**/*.kicad_pro",
    "**/*.cir",
    "**/*.net",
    "hardware/cad_parts/**/*.json",
    "hardware/pcb/**/*.json",
    "hardware/eda_flow/**/*.json",
    "hardware/icd/electrical/**/*.json",
    "hardware/icd/parts/S1.*.json",
    "hardware/icd/parts/S2.*.json",
    "hardware/icd/parts/S3.*.json",
    "hardware/icd/parts/S4.*.json",
    "hardware/icd/parts/S5.*.json",
    "hardware/icd/parts/S6.*.json",
    "hardware/icd/parts/S7.*.json",
    "hardware/icd/parts/S9.*.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 berkmec (https://counfield.com/)"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# Rule 4 — Documentation, scientific reports & rendered figures (prose and static visual plates)
[[annotations]]
path = [
    "**/*.md",
    "**/*.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 berkmec (https://counfield.com/)"
SPDX-License-Identifier = "CC-BY-SA-4.0"
